name: Trigger due reminders

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  call-function:
    runs-on: ubuntu-latest
    steps:
      - name: Call sendDueReminders
        run: |
          curl -sf "https://asia-east1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net/sendDueReminders?key=${{ secrets.CRON_SECRET }}"
